  <script>
    // Floating photo that follows the cursor over the project list (mouse devices only)
    (function () {
      var list = document.querySelector(".index-list");
      var preview = document.querySelector(".index-preview");
      if (!list || !preview) return;
      if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;

      var img = preview.querySelector("img");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var x = 0, y = 0, cx = 0, cy = 0, raf = null;

      function tick() {
        var ease = reduce ? 1 : 0.14;
        cx += (x - cx) * ease;
        cy += (y - cy) * ease;
        preview.style.transform = "translate3d(" + cx + "px," + cy + "px,0)";
        raf = Math.abs(x - cx) > 0.3 || Math.abs(y - cy) > 0.3 ? requestAnimationFrame(tick) : null;
      }

      function moveTo(px, py) {
        var w = preview.offsetWidth, h = preview.offsetHeight;
        var tx = px + 40;
        if (tx + w > window.innerWidth - 10) tx = px - 40 - w;
        var ty = Math.max(10, Math.min(window.innerHeight - h - 10, py - h / 2));
        x = tx; y = ty;
        if (!preview.classList.contains("show")) { cx = x; cy = y; }
        if (!raf) raf = requestAnimationFrame(tick);
      }

      function show(item, px, py) {
        if (img.getAttribute("src") !== item.dataset.img) img.src = item.dataset.img;
        moveTo(px, py);
        preview.classList.add("show");
      }
      function hide() { preview.classList.remove("show"); }

      list.addEventListener("mousemove", function (e) {
        var item = e.target.closest(".index-item");
        if (!item) return hide();
        show(item, e.clientX, e.clientY);
      });
      list.addEventListener("mouseleave", hide);

      // keyboard users: show the photo beside the focused row
      list.addEventListener("focusin", function (e) {
        var item = e.target.closest(".index-item");
        if (!item) return;
        var r = item.getBoundingClientRect();
        show(item, r.left + r.width * 0.6, r.top + r.height / 2);
      });
      list.addEventListener("focusout", hide);
    })();
  </script>
